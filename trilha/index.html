<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trilha RFT · Molduras relacionais</title>
<link rel="icon" href="icone.png">
<style>
  :root { --roxo:#5b4bd6; --roxo2:#4536b8; --verde:#1fa971; --verde2:#168a5b; --laranja:#f29d1a; --verm:#e0533d; --cinza:#eef0f5; --borda:#e1e4ec; --texto:#252a3a; --suave:#6b7186; --fundo:#fbfbfe;
    --u1:#5b4bd6; --u2:#e0533d; --u3:#0f9fb5; --u4:#f29d1a; --u5:#1fa971; --u6:#7c3aed; --u7:#be185d; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:"Nunito","Segoe UI",Roboto,Arial,sans-serif; color:var(--texto); background:var(--fundo); }
  button { font-family:inherit; }
  .app { display:grid; grid-template-columns:240px minmax(520px, 1fr) 320px; min-height:100vh; }
  /* menu */
  #menu { border-right:2px solid var(--borda); padding:22px 14px; position:sticky; top:0; height:100vh; background:#fff; }
  .logo { font-weight:900; font-size:24px; color:var(--roxo); padding:0 10px 22px; letter-spacing:-.5px; }
  .logo small { display:block; font-size:12px; color:var(--suave); font-weight:700; letter-spacing:0; }
  #menu button { display:flex; align-items:center; gap:12px; width:100%; border:2px solid transparent; background:none; padding:11px 12px; border-radius:14px; font-size:15px; font-weight:800; color:var(--suave); cursor:pointer; text-transform:uppercase; letter-spacing:.4px; margin-bottom:4px; }
  #menu button .ic { font-size:22px; width:28px; text-align:center; }
  #menu button.on { background:#efedfd; border-color:#c9c2f5; color:var(--roxo); }
  #menu button:hover:not(.on) { background:var(--cinza); }
  /* centro */
  #centro { padding:24px 40px 80px; }
  .pagina { max-width:640px; margin:0 auto; }
  h1.tit { font-size:26px; margin:6px 0 18px; }
  /* trilha */
  .unidade { border-radius:16px; color:#fff; padding:16px 20px; margin:26px 0 10px; display:flex; justify-content:space-between; align-items:center; gap:14px; }
  .unidade b { font-size:20px; display:block; }
  .unidade span { opacity:.92; font-size:14px; font-weight:700; }
  .unidade .guia { border:2px solid #ffffff88; background:#ffffff22; color:#fff; border-radius:12px; padding:9px 14px; font-weight:800; cursor:pointer; font-size:13px; white-space:nowrap; }
  .fase-sep { display:flex; align-items:center; gap:12px; color:var(--suave); font-weight:800; font-size:13px; text-transform:uppercase; letter-spacing:.6px; margin:22px 0 8px; }
  .fase-sep::before, .fase-sep::after { content:""; flex:1; height:2px; background:var(--borda); }
  .trilha { display:flex; flex-direction:column; align-items:center; gap:52px; padding:18px 0 8px; }
  .no-wrap { position:relative; display:flex; flex-direction:column; align-items:center; }
  .no { width:74px; height:68px; border-radius:50%; border:none; cursor:pointer; font-size:28px; color:#fff; position:relative; background:var(--cor, var(--roxo)); box-shadow:0 7px 0 var(--cor2, var(--roxo2)); transition:transform .1s; }
  .no:active { transform:translateY(4px); box-shadow:0 3px 0 var(--cor2); }
  .no.bloq { background:#d9dce5; box-shadow:0 7px 0 #b9bdca; color:#a7acbb; cursor:not-allowed; }
  .no.feito { background:var(--laranja); box-shadow:0 7px 0 #c97c05; }
  .no.met { background:var(--verm); box-shadow:0 7px 0 #b33a27; }
  .no.atual::after { content:""; position:absolute; inset:-10px; border-radius:50%; border:4px solid var(--cor, var(--roxo)); opacity:.35; animation:pulsa 1.6s infinite; }
  @keyframes pulsa { 50% { transform:scale(1.08); opacity:.15; } }
  .balao { position:absolute; top:-42px; background:#fff; border:2px solid var(--borda); color:var(--cor, var(--roxo)); font-weight:900; padding:6px 12px; border-radius:12px; font-size:13px; white-space:nowrap; letter-spacing:.5px; }
  .no-rot { font-size:12.5px; font-weight:800; color:var(--suave); margin-top:12px; max-width:190px; text-align:center; line-height:1.25; }
  .no-rot .crit { display:block; font-weight:700; font-size:11px; color:#9aa0b2; }
  .no-wrap.l1 { transform:translateX(-70px); } .no-wrap.l2 { transform:translateX(-110px); } .no-wrap.r1 { transform:translateX(70px); } .no-wrap.r2 { transform:translateX(110px); }
  /* lateral */
  #lateral { padding:24px 22px; position:sticky; top:0; height:100vh; overflow:auto; }
  .stats { display:flex; gap:10px; margin-bottom:16px; }
  .stat { flex:1; border:2px solid var(--borda); border-radius:14px; padding:10px; text-align:center; font-weight:900; font-size:18px; background:#fff; }
  .stat small { display:block; font-size:11px; color:var(--suave); font-weight:800; text-transform:uppercase; }
  .cx-lat { border:2px solid var(--borda); border-radius:16px; padding:16px; margin-bottom:16px; background:#fff; }
  .cx-lat h3 { margin:0 0 8px; font-size:16px; }
  .cx-lat p { margin:6px 0; font-size:14px; color:var(--suave); line-height:1.45; }
  select, input[type=text] { font-family:inherit; font-size:15px; padding:9px 10px; border:2px solid var(--borda); border-radius:12px; width:100%; font-weight:700; }
  .btn { border:none; border-radius:14px; padding:12px 18px; font-weight:900; font-size:15px; cursor:pointer; color:#fff; background:var(--roxo); box-shadow:0 4px 0 var(--roxo2); text-transform:uppercase; letter-spacing:.5px; }
  .btn:active { transform:translateY(3px); box-shadow:0 1px 0 var(--roxo2); }
  .btn.verde { background:var(--verde); box-shadow:0 4px 0 var(--verde2); }
  .btn.sec { background:#fff; color:var(--suave); border:2px solid var(--borda); box-shadow:0 4px 0 var(--borda); }
  .btn:disabled { opacity:.45; cursor:default; }
  table { border-collapse:collapse; width:100%; font-size:14px; background:#fff; }
  th, td { border-bottom:1px solid var(--borda); padding:8px 6px; text-align:left; vertical-align:middle; }
  th { color:var(--suave); font-size:12px; text-transform:uppercase; }
  .tag { display:inline-block; font-size:11px; font-weight:800; padding:2px 8px; border-radius:99px; background:var(--cinza); color:var(--suave); }
  .tag.feito { background:#fff1db; color:#b46c00; } .tag.and { background:#efedfd; color:var(--roxo); } .tag.met { background:#fde6e2; color:var(--verm); } .tag.ref { background:#e2f6ee; color:var(--verde2); }
  .ajuda { font-size:13px; color:var(--suave); line-height:1.5; }
  /* lição */
  #licao { position:fixed; inset:0; background:#fff; display:none; flex-direction:column; z-index:10; }
  #licao.aberta { display:flex; }
  .l-topo { display:flex; align-items:center; gap:18px; padding:22px 40px 8px; max-width:1000px; width:100%; margin:0 auto; }
  .fechar { border:none; background:none; font-size:28px; color:#9aa0b2; cursor:pointer; }
  .barra { flex:1; height:18px; background:var(--cinza); border-radius:99px; overflow:hidden; }
  .barra span { display:block; height:100%; background:var(--verde); border-radius:99px; transition:width .4s; box-shadow:inset 0 -5px 0 #0000001a; }
  .l-cont { font-weight:900; color:var(--suave); min-width:70px; text-align:right; }
  .l-meio { flex:1; overflow:auto; display:flex; flex-direction:column; align-items:center; padding:10px 40px 20px; }
  .l-tipo { font-weight:900; color:var(--roxo); font-size:14px; letter-spacing:.6px; text-transform:uppercase; margin:10px 0 6px; }
  .l-perg { font-size:28px; font-weight:900; text-align:center; max-width:820px; display:flex; align-items:center; gap:12px; justify-content:center; }
  .falar { border:none; background:#efedfd; color:var(--roxo); width:46px; height:46px; border-radius:14px; font-size:22px; cursor:pointer; box-shadow:0 4px 0 #c9c2f5; flex:none; }
  .regra { margin:16px 0 4px; background:#fff8e6; border:2px solid #f6d48a; border-radius:16px; padding:12px 20px; font-size:22px; font-weight:800; display:flex; gap:14px; align-items:center; flex-wrap:wrap; justify-content:center; }
  .regra .sb { height:52px; }
  .amostra { margin:18px 0 8px; border:2px solid var(--borda); border-radius:18px; padding:14px 22px; min-width:220px; min-height:150px; display:flex; align-items:center; justify-content:center; background:#fafbff; }
  .ops { display:flex; gap:18px; flex-wrap:wrap; justify-content:center; margin-top:16px; }
  .op { border:2px solid var(--borda); border-bottom-width:5px; background:#fff; border-radius:18px; min-width:180px; min-height:170px; padding:12px; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:transform .08s; }
  .op:hover { border-color:#c9c2f5; background:#faf9ff; }
  .op:active { transform:translateY(2px); }
  .op.sel { border-color:var(--roxo); background:#efedfd; }
  .op.certa { border-color:var(--verde); background:#e5f8ef; }
  .op.errada { border-color:var(--verm); background:#fde9e5; }
  .op.neutra { border-color:#9aa0b2; background:var(--cinza); }
  .txtop { font-size:30px; font-weight:900; letter-spacing:1px; color:var(--texto); }
  .cx { height:150px; display:flex; align-items:flex-end; justify-content:center; }
  .fig { display:block; height:auto; }
  .par { display:flex; gap:14px; align-items:flex-end; }
  .par .cx { height:120px; }
  .seta { color:var(--roxo); font-size:28px; font-weight:900; align-self:center; }
  .marca { outline:4px solid var(--laranja); outline-offset:4px; border-radius:10px; }
  .sb { height:120px; width:auto; }
  .cena { position:relative; width:200px; height:170px; }
  .cena .ref { position:absolute; left:40px; bottom:10px; width:120px; }
  .cena .obj { position:absolute; width:62px; left:69px; }
  .cena .obj.cima { bottom:116px; } .cena .obj.baixo { bottom:12px; width:46px; left:77px; }
  .cena .obj.frente { bottom:4px; width:78px; left:24px; z-index:2; } .cena .obj.atras { bottom:84px; width:54px; left:108px; z-index:0; }
  .cena .ref.mesa { z-index:1; }
  .predio { display:flex; flex-direction:column; border:4px solid #8a6d4b; border-top-width:14px; border-radius:6px 6px 0 0; background:#f2e6d8; width:150px; }
  .andar { height:70px; border-top:3px solid #8a6d4b; display:flex; align-items:center; justify-content:center; }
  .andar:first-child { border-top:none; }
  .andar img { height:56px; } .andar .sb { height:52px; }
  .andar.coberto { background:repeating-linear-gradient(45deg, #c9b79f, #c9b79f 8px, #d8c8b3 8px, #d8c8b3 16px); font-size:30px; color:#8a6d4b; font-weight:900; }
  .pessoa { display:flex; flex-direction:column; align-items:center; gap:4px; }
  .pessoa .com { height:52px; }
  .ver { font-size:34px; font-weight:900; color:var(--suave); }
  .l-base { border-top:2px solid var(--borda); padding:18px 40px; display:flex; justify-content:center; }
  .l-base-in { max-width:1000px; width:100%; display:flex; justify-content:space-between; align-items:center; gap:14px; }
  .l-base.ok { background:#d7ffb8; border-top-color:#b6ef8b; } .l-base.no { background:#ffdfe0; border-top-color:#ffc1c1; }
  .fb-txt { font-size:22px; font-weight:900; } .l-base.ok .fb-txt { color:#3b8a00; } .l-base.no .fb-txt { color:#d03636; }
  .terap { display:flex; gap:10px; align-items:center; }
  .terap small { color:var(--suave); font-weight:800; }
  .olhe { font-size:26px; font-weight:900; color:var(--suave); }
  .fim { text-align:center; padding-top:40px; }
  .fim .grande { font-size:80px; }
  .fim h2 { font-size:30px; margin:10px 0; }
  .fim .cards { display:flex; gap:14px; justify-content:center; margin:22px 0; }
  .fim .cards div { border:2px solid var(--borda); border-radius:14px; padding:12px 20px; min-width:150px; font-weight:900; font-size:22px; }
  .fim .cards small { display:block; font-size:12px; color:var(--suave); text-transform:uppercase; }
  .pontos { display:flex; gap:3px; flex-wrap:wrap; justify-content:center; margin-top:8px; }
  .pontos i { width:14px; height:14px; border-radius:4px; background:var(--verde); display:inline-block; }
  .pontos i.n { background:var(--verm); }
  details.guia-txt { background:#fff; border:2px solid var(--borda); border-radius:14px; padding:12px 16px; margin-bottom:12px; }
  details.guia-txt summary { font-weight:900; cursor:pointer; }
  .acoes-tab button { border:none; background:none; color:var(--roxo); font-weight:800; cursor:pointer; font-size:12px; }
  .rec { display:flex; flex-direction:column; align-items:center; gap:4px; }
  .rec small, .cad small, .pessoa small { font-weight:800; color:var(--suave); font-size:13px; }
  .pote { border:4px solid #7aa7c7; border-top:none; border-radius:0 0 26px 26px; background:#e6f3fc88; padding:10px 8px 8px; min-width:86px; min-height:84px; display:flex; align-items:flex-end; justify-content:center; gap:4px; }
  .caixaT { border:5px solid #b07a45; border-radius:8px; background:#f6ead988; padding:10px; min-width:110px; min-height:96px; display:flex; align-items:flex-end; justify-content:center; gap:8px; }
  .deit { display:flex; gap:36px; align-items:flex-end; }
  .pes { display:flex; flex-direction:column; align-items:center; gap:6px; }
  .pes b { font-size:16px; color:var(--roxo); text-transform:uppercase; letter-spacing:.5px; }
  .cad { display:flex; flex-direction:column; align-items:center; gap:4px; }
</style>
</head>
<body>
<div class="app">
  <aside id="menu">
    <div class="logo">Trilha RFT<small>Molduras relacionais · Siri Ming</small></div>
    <button data-pg="trilha" class="on"><span class="ic">🧭</span>Trilha</button>
    <button data-pg="progresso"><span class="ic">📊</span>Progresso</button>
    <button data-pg="aprendizes"><span class="ic">👤</span>Aprendizes</button>
    <button data-pg="guia"><span class="ic">📘</span>Como funciona</button>
  </aside>
  <main id="centro"><div class="pagina" id="pagina"></div></main>
  <aside id="lateral"></aside>
</div>
<div id="licao"></div>

// ================= Utilidades =================
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const embaralhar = (a) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const sortear = (a, n = 1, menos = []) => embaralhar(a.filter(x => !menos.includes(x))).slice(0, n);
const hoje = () => new Date().toISOString().slice(0, 10);
const svgUri = (s) => 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(s)));
function criterio(resps, A, N) { if (resps.length < N) return false; return resps.slice(-N).filter(r => r).length >= A; }
function falar(t) { if (!('speechSynthesis' in window) || !t) return; speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(t); u.lang = 'pt-BR'; u.rate = 0.9; speechSynthesis.speak(u); }

try { const s = JSON.parse(localStorage.getItem(CHAVE) || 'null'); if (s) BD = Object.assign(BD, s); } catch (e) {}
const gravar = () => { try { localStorage.setItem(CHAVE, JSON.stringify(BD)); } catch (e) { alert('Não foi possível salvar neste navegador.'); } };
const APR = () => BD.aprendizes.find(a => a.id === BD.atual);
const progDe = (licId) => { const a = BD.atual; BD.prog[a] = BD.prog[a] || {}; return BD.prog[a][licId] = BD.prog[a][licId] || { estado:'nova', falhas:0, sessoes:0, melhor:null, conj:0 }; };

// ================= Figuras =================
const fig = (n, e = 1, cls = '') => `<img class="fig ${cls}" src="${FIG[n]}" alt="${esc(n.toLowerCase())}" style="width:${Math.round(105 * e)}px">`;
const cx = (h) => `<div class="cx">${h}</div>`;
const par = (a, b, ea = 1, eb = 1, marcaB = false) => `<div class="par">${cx(fig(a, ea))}${cx(fig(b, eb, marcaB ? 'marca' : ''))}</div>`;
function copo(n) { const y = 120 - 96 * n; return `<img class="fig" style="width:84px" src="${svgUri(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 130"><path d="M14 8 L86 8 L76 124 L24 124 Z" fill="#eaf6ff" stroke="#5c7a99" stroke-width="5"/>${n > 0 ? `<clipPath id="c"><path d="M14 8 L86 8 L76 124 L24 124 Z"/></clipPath><rect clip-path="url(#c)" x="0" y="${y}" width="100" height="${130 - y}" fill="#ff9f1c"/>` : ''}</svg>`)}" alt="copo">`; }
// símbolos arbitrários: nome sem sentido + forma e cor próprias
const SIMB = { BOP:['tri', '#5b4bd6'], ZAG:['estrela', '#e0533d'], LUM:['circ', '#0f9fb5'], KEV:['quad', '#f29d1a'], TIP:['losango', '#1fa971'], MOR:['hex', '#c2410c'], DAX:['gota', '#7c3aed'], FEP:['cruz', '#0369a1'], NUL:['lua', '#be185d'], RUX:['tri', '#15803d'], JOF:['quad', '#9333ea'], PEV:['circ', '#b45309'] };
const CONJ = [['BOP', 'ZAG', 'LUM'], ['KEV', 'TIP', 'MOR'], ['DAX', 'FEP', 'NUL'], ['RUX', 'JOF', 'PEV']];
function simb(n, h = 120) {
  const [f, c] = SIMB[n]; const formas = { tri:'<polygon points="50,8 92,82 8,82" />', estrela:'<polygon points="50,6 61,36 93,36 67,55 77,86 50,67 23,86 33,55 7,36 39,36"/>', circ:'<circle cx="50" cy="47" r="40"/>', quad:'<rect x="12" y="8" width="76" height="76" rx="10"/>', losango:'<polygon points="50,4 92,46 50,88 8,46"/>', hex:'<polygon points="28,8 72,8 94,46 72,84 28,84 6,46"/>', gota:'<path d="M50 6 C70 36 86 52 86 64 a36 26 0 0 1 -72 0 C14 52 30 36 50 6Z"/>', cruz:'<path d="M36 8h28v26h26v28H64v26H36V62H10V34h26z"/>', lua:'<path d="M62 6 a42 42 0 1 0 28 72 a34 34 0 1 1 -28 -72z"/>' };
  return `<img class="sb" style="height:${h}px" src="${svgUri(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 118"><g fill="${c}">${formas[f]}</g><text x="50" y="112" font-family="Arial" font-weight="900" font-size="22" text-anchor="middle" fill="#252a3a">${n}</text></svg>`)}" alt="${n}">`;
}
function caixa(n) { return `<img class="sb" style="height:130px" src="${svgUri(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120"><rect x="8" y="34" width="104" height="80" rx="6" fill="#c8915a" stroke="#8a5a2b" stroke-width="4"/><rect x="2" y="22" width="116" height="20" rx="4" fill="#b07a45" stroke="#8a5a2b" stroke-width="4"/><text x="60" y="88" font-family="Arial" font-weight="900" font-size="26" text-anchor="middle" fill="#fff">${n}</text></svg>`)}" alt="caixa ${n}">`; }
const cena = (obj, rel, ref = 'CADEIRA') => `<div class="cena"><img class="ref ${rel === 'frente' || rel === 'atras' ? 'mesa' : ''}" src="${FIG[ref]}" alt=""><img class="obj ${rel}" src="${FIG[obj]}" alt=""></div>`;
const predio = (moradores, coberto = false) => `<div class="predio">${moradores.map(m => `<div class="andar ${coberto ? 'coberto' : ''}">${coberto ? '?' : (SIMB[m] ? simb(m, 52) : `<img src="${FIG[m]}" alt="">`)}</div>`).join('')}</div>`;

// mk: monta a tentativa com a resposta certa em posição sorteada
function mk(perg, certa, erradas, extra = {}) { const ops = embaralhar([certa, ...erradas]); return Object.assign({ perg, ops, c: ops.indexOf(certa) }, extra); }
const tato = (perg, amostra, extra = {}) => Object.assign({ perg, amostra, tato:true, ops:[], c:-1 }, extra);
const simnao = (perg, amostra, sim) => ({ perg, amostra, ops:[txt('SIM'), txt('NÃO')], c: sim ? 0 : 1 });

const OBJ = ['CARRO', 'BOLA', 'CASA', 'GATO', 'MAÇÃ', 'LÁPIS', 'COPO', 'LIVRO', 'CHAVE', 'RELÓGIO', 'SAPATO', 'MOCHILA'];

  ouvI: (lista = OBJ) => { const [x, y] = sortear(lista, 2); return mk('Mostre o IGUAL', cx(fig(x)), [cx(fig(y))], { amostra: cx(fig(x)), tipo:'Ouvinte' }); },
  ouvD: (lista = OBJ) => { const [x, y] = sortear(lista, 2); return mk('Mostre o DIFERENTE', cx(fig(y)), [cx(fig(x))], { amostra: cx(fig(x)), tipo:'Ouvinte' }); },
  tato: () => { const [x, y] = sortear(OBJ, 2), ig = Math.random() < .5; return tato('São IGUAIS ou DIFERENTES?', ig ? par(x, x) : par(x, y), { tipo:'Tato', resposta: ig ? 'iguais' : 'diferentes' }); },
  sn: () => { const [x, y] = sortear(OBJ, 2), ig = Math.random() < .5, perg = Math.random() < .5; return simnao(perg ? 'Eles são IGUAIS?' : 'Eles são DIFERENTES?', ig ? par(x, x) : par(x, y), perg ? ig : !ig); },
  jogo: () => { const P = ['MENINO', 'MENINA', 'PAPAI', 'MULHER'], C = ['PIZZA', 'BOLO', 'SORVETE', 'PIPOCA']; const [a, b, c] = sortear(P, 3), [ca, cc] = sortear(C, 2); const igual = Math.random() < .5; return mk(igual ? `Quem gosta da MESMA comida que ele?` : `Quem gosta de comida DIFERENTE da dele?`, pessoa(igual ? b : c, igual ? ca : cc), [pessoa(igual ? c : b, igual ? cc : ca)], { amostra: pessoa(a, ca), tipo:'Jogo de transição' }); },
  // arbitrário: coordenação por regra (X é igual a Y)

  ouvM: () => { const o = sortear(CONT)[0]; return mk('Mostre o MAIOR', cx(fig(o, ESC[4])), [cx(fig(o, ESC[0]))], { tipo:'Ouvinte' }); },

  contm: () => { const o = sortear(CONT)[0]; return mk('Mostre um MENOR que este', cx(fig(o, ESC[sortear([0, 1])[0]])), [cx(fig(o, ESC[sortear([3, 4])[0]]))], { amostra: cx(fig(o, ESC[2])), tipo:'Contínuo (amostra do meio)' }); },

};

  const [f1, f2] = sortear(COMIDAS_D, 2), hoje = Math.random() < .5, certo = inv ? (hoje ? f1 : f2) : (hoje ? f2 : f1);

}

// ----- Fase arbitrária (Using RFT vol. 1): regras com símbolos sem sentido -----
// X R Y (treino) → inverso (implicação mútua) → X R Y R Z → combinação (implicação mútua combinatória)
function arbitrario(u, k) {
  const tipo = u.k;
  const vis = (n) => tipo === 'comp' ? caixa(n) : simb(n);
  const regra = (x, rel, y) => `<div class="regra">${simb(x, 52)} <span>${x} ${rel} ${y}</span> ${simb(y, 52)}</div>`;
  const R = {
    coord: { r:(x, y) => regra(x, 'é IGUAL a', y), p:(x) => `Qual é IGUAL a ${x}?`, im:(y) => `Qual é IGUAL a ${y}?`, imc:(z) => `Qual é IGUAL a ${z}?` },
    comp: { r:(x, y) => regra(x, 'tem MAIS balas que', y), p:() => 'Qual tem MAIS balas?', im:() => 'Qual tem MENOS balas?' },
    opos: { r:(x, y) => regra(x, 'é o OPOSTO de', y), p:(x) => `Qual é o OPOSTO de ${x}?`, im:(y) => `Qual é o OPOSTO de ${y}?` },
    hier: { r:(x, y) => regra(x, 'CONTÉM', y), p:(x) => `O que está DENTRO de ${x}?`, im:(y) => `${y} está DENTRO de qual?` },
    esp: { r:(x, y) => regra(x, 'mora EM CIMA de', y), p:(x) => `Quem mora EMBAIXO de ${x}?`, im:(y) => `Quem mora EM CIMA de ${y}?` },
    temp: { r:(x, y) => regra(x, 'acontece ANTES de', y), p:(x) => `O que acontece DEPOIS de ${x}?`, im:(y) => `O que acontece ANTES de ${y}?` }
  }[tipo];
  const [A, B, C] = CONJ[k % CONJ.length], [D] = CONJ[(k + 1) % CONJ.length];
  const t = (x, y, comRegra, perg, certa, errada, amostra) => mk(perg, vis(certa), [vis(errada)], { regra: comRegra ? R.r(x, y) : '', amostra: amostra || (tipo === 'esp' ? predio([x, y], true) : ''), tipo: comRegra ? 'Treino com a regra' : '' });
  // relações treinadas: A-B e B-C (para coord, opos: pergunta pelo par; comp, esp, temp: escolha entre os dois)
  const treino1 = (r) => tipo === 'comp' ? t(A, B, r, R.p(), A, B) : tipo === 'coord' || tipo === 'opos' ? t(A, B, r, R.p(A), B, D) : t(A, B, r, R.p(A), B, D);
  const treino2 = (r) => tipo === 'comp' ? t(B, C, r, R.p(), B, C) : tipo === 'coord' || tipo === 'opos' ? t(B, C, r, R.p(B), C, D) : t(B, C, r, R.p(B), C, D);
  const regras2 = (x) => Object.assign(x, { regra: R.r(A, B) + R.r(B, C) });
  const im = () => tipo === 'comp' ? [t(A, B, false, R.im(), B, A), t(B, C, false, R.im(), C, B)] : [t(A, B, false, R.im(B), A, D), t(B, C, false, R.im(C), B, D)];
  const imc = () => {
    if (tipo === 'coord') return [mk(`Qual é IGUAL a ${C}?`, vis(A), [vis(D)]), mk(`Qual é IGUAL a ${A}?`, vis(C), [vis(D)])];
    if (tipo === 'opos') return [mk(`${A} é o OPOSTO de ${B}. ${B} é o OPOSTO de ${C}. Então ${A} e ${C} são...`, txt('IGUAIS'), [txt('OPOSTOS')]), mk(`Qual é IGUAL a ${C}?`, vis(A), [vis(B)])];
    if (tipo === 'comp') return [mk('Qual tem MAIS balas?', vis(A), [vis(C)]), mk('Qual tem MENOS balas?', vis(C), [vis(A)])];
    if (tipo === 'hier') return [mk(`${C} está DENTRO de qual?`, vis(A), [vis(D)]), mk(`${A} está DENTRO de ${C}?`, txt('NÃO'), [txt('SIM')]), mk(`${C} está DENTRO de ${A}?`, txt('SIM'), [txt('NÃO')])];
    if (tipo === 'esp') return [mk('Quem mora mais EM CIMA?', vis(A), [vis(C)], { amostra: predio([A, B, C], true) }), mk('Quem mora mais EMBAIXO?', vis(C), [vis(A)], { amostra: predio([A, B, C], true) })];
    return [mk('O que acontece PRIMEIRO?', vis(A), [vis(C)]), mk('O que acontece POR ÚLTIMO?', vis(C), [vis(A)])];
  };
  const funcao = () => {
    if (tipo === 'coord') return [mk(`${A} é um doce gostoso. ${C} é IGUAL a ${A}. Qual você quer?`, vis(C), [vis(D)])];
    if (tipo === 'opos') return [mk(`${A} está QUENTE. ${B} é o OPOSTO de ${A}. Qual você pode pegar com a mão?`, vis(B), [vis(A)])];
    if (tipo === 'comp') return [mk('Você quer o máximo de balas. Qual caixa você escolhe?', vis(A), [vis(C)])];
    if (tipo === 'hier') return [mk(`Tudo que está dentro de ${A} tem pintas. ${C} está dentro de ${B}, e ${B} está dentro de ${A}. ${C} tem pintas?`, txt('SIM'), [txt('NÃO')])];
    if (tipo === 'esp') return [mk('O presente está no andar de cima de todos. Com quem está o presente?', vis(A), [vis(C)], { amostra: predio([A, B, C], true) })];
    return [mk(`Você ganha um prêmio quando ${C} acontece. O que vem antes do prêmio: ${A} ou ${C}?`, vis(C), [vis(A)])];
  };
  return { treino1, treino2, regras2, im, imc, funcao, A, B, C };
}

function ordemClasses(n, nCl, modo) {
  const seq = [];
  if (modo === 'unico' || nCl === 1) return Array(n).fill(0);
  if (modo === 'blocos3') { let k = Math.floor(Math.random() * nCl); while (seq.length < n) { for (let b = 0; b < 3 && seq.length < n; b++) seq.push(k); k = (k + 1) % nCl; } return seq; }
  while (seq.length < n) { const x = Math.floor(Math.random() * nCl); const L = seq.length; if (L >= 2 && seq[L - 1] === x && seq[L - 2] === x) continue; seq.push(x); }

function telaGuia() {
  $('#pagina').innerHTML = `<h1 class="tit">Como funciona</h1>
  <details class="guia-txt" open><summary>A ordem das molduras</summary><p class="ajuda">Igual e diferente → comparação → oposição (usando os extremos dos mesmos contínuos da comparação) → espacial → hierarquia → temporal → dêiticos. Cada unidade abre quando a fase não arbitrária da anterior termina. Referência principal: Ming, Stewart e McElwee, <i>Using Relational Frame Theory to Promote Language Development</i>, vol. 1 e 2. Hierarquia e dêiticos não estão nesses volumes: foram montados a partir de outros autores (abaixo), no mesmo formato de treino e teste.</p></details>
  <details class="guia-txt"><summary>Hierarquia</summary><p class="ajuda">Ensinada vendo o que está dentro de quê, com recipientes transparentes (pote dentro da caixa), e com as dicas "está dentro / contém / pertence / é um tipo de". Depois vêm grupos (animais, frutas, roupas), a pergunta invertida ("todo animal é gato?", que é o ponto da assimetria da hierarquia) e, na fase arbitrária, "BOP contém ZAG, ZAG contém LUM": LUM está dentro de BOP, mas BOP não está dentro de LUM; e o que vale para o grupo vale para quem está dentro dele (transformação de função). Base: Slattery e Stewart; Gil, Luciano, Ruiz e Valdivia-Salas; revisão sobre categorização hierárquica na <i>Revista Perspectivas</i> (2021).</p></details>
  <details class="guia-txt"><summary>Dêiticos (tomada de perspectiva)</summary><p class="ajuda">Relações eu–você, aqui–ali e agora–antes, em três níveis do protocolo de McHugh, Barnes-Holmes e Barnes-Holmes (2004): simples ("eu tenho X e você tem Y; o que eu tenho?"), invertido ("se eu fosse você e você fosse eu...") e duplamente invertido (as duas inversões se anulam). Primeiro com figuras de apoio (eu = quem pergunta, você = o aprendiz), depois sem figuras, e por fim com outra pessoa perguntando (generalização, como em Gilroy et al., 2015). Critério: 8 de 10 (80%), como na tese de Carolina Silveira de Almeida (UFSCar, 2019). Da mesma tese vêm o pré-requisito (a unidade só abre depois da fase arbitrária de igual e diferente; a criança com autismo só mostrou tomada de perspectiva depois de a coordenação chegar ao nível de relacionar relações) e a lição de perspectiva com propriedades ("você é baixo, o papai é alto; se o papai fosse você, ele seria...?"). Cuidado: revisões recentes (Hempkin, Sivaraman e Barnes-Holmes, 2024) acham poucos estudos com autistas e evidência ainda limitada de que esse treino mude a tomada de perspectiva no dia a dia; vale medir também fora do app.</p></details>
  <details class="guia-txt" open><summary>Fase 1 · não arbitrária</summary><p class="ajuda">A relação está nas próprias figuras. Sequência: emparelhamento relacional (pares que mostram a mesma relação) → ouvinte → tato → sim/não. Em cada uma: só um tipo → blocos de 3 → misturado. Critério: 7 corretas em 8 seguidas, até 25 tentativas, com feedback e reforço. Na comparação, os contínuos têm 5 tamanhos e a pergunta "maior que este" usa a amostra do meio. No temporal, ele vê os itens aparecerem um depois do outro. Os jogos de transição (quem gosta da mesma comida, quem mora onde) fazem a ponte para a fase 2.</p></details>
  <details class="guia-txt" open><summary>Fase 2 · arbitrária</summary><p class="ajuda">A relação só existe pela regra, com símbolos sem sentido (BOP, ZAG, LUM...). Treino com a regra de cada relação (6 seguidas) → manutenção sem regra (6/8, sem feedback) → teste de implicação mútua (5/6) → revisão misturada (11/12) → teste de implicação combinatória (7/8) → transformação de função. Falhou num teste: as lições de treino voltam para "refazer" e o teste pode ser repetido uma vez. Falhou de novo: aparece a lição de ensino com vários exemplos (MET) e o teste seguinte usa um conjunto novo de símbolos.</p></details>

  const pergHtml = `<div class="l-perg">${esc(t.perg)} <button class="falar" id="fl" title="Ouvir">🔊</button></div>`;
  const corpo = `<div class="l-meio"><div class="l-tipo">${esc(lic.u.nome)} · ${esc(t.tipo || lic.titulo)}${fb ? '' : ' · sem feedback'}</div>${pergHtml}${t.regra || ''}${t.amostra ? `<div class="amostra">${t.amostra}</div>` : ''}<div class="ops">${t.ops.map((o, i) => `<button class="op" data-i="${i}">${o}</button>`).join('')}</div></div>`;
  const base = t.tato ? `<div class="l-base"><div class="l-base-in"><div class="terap"><small>Terapeuta · resposta esperada: <b>${esc(t.resposta || '')}</b></small></div><div class="terap"><button class="btn sec" id="tErr">✗ Errou</button><button class="btn verde" id="tAc">✓ Acertou</button></div></div></div>` : `<div class="l-base"><div class="l-base-in"><span class="ajuda">${fb ? 'Toque na resposta' : 'Teste: sem feedback'}</span><span></span></div></div>`;
  $('#licao').innerHTML = topo + corpo + base;
  $('#fx').onclick = () => { if (!L.resps.length || confirm('Sair da lição? O que foi feito fica salvo.')) fecharLicao(); };
  $('#fl').onclick = () => falar(t.perg);
  document.querySelectorAll('#licao .op').forEach(b => b.onclick = () => responder(+b.dataset.i));
  if (t.tato) { $('#tAc').onclick = () => responder(null, true); $('#tErr').onclick = () => responder(null, false); }
  if (t.anim) animar(t);
}
function animar(t) {
  L.bloq = true; const meio = $('#licao .l-meio'), guard = meio.innerHTML, alvo = L.tent[L.i];
  meio.innerHTML = `<div class="l-tipo">${esc(L.lic.u.nome)}</div><div class="olhe">Olhe!</div><div class="amostra" id="anim"></div>`;
  t.anim.forEach((h, k) => { setTimeout(() => { if (L && L.tent[L.i] === alvo) $('#anim').innerHTML = h; }, 600 + k * 1600); setTimeout(() => { if (L && L.tent[L.i] === alvo) $('#anim').innerHTML = ''; }, 600 + k * 1600 + 1200); });
  setTimeout(() => { if (!L || L.tent[L.i] !== alvo) return; meio.innerHTML = guard; L.bloq = false; document.querySelectorAll('#licao .op').forEach(b => b.onclick = () => responder(+b.dataset.i)); $('#fl').onclick = () => falar(t.perg); }, 600 + t.anim.length * 1600 + 100);
}
function responder(i, tatoOk) {
  if (!L || L.bloq) return;
  const t = L.tent[L.i], lic = L.lic, fb = lic.tipo !== 'teste';
  const certo = t.tato ? tatoOk : i === t.c;
  L.bloq = true; L.resps.push(certo);
  const ops = document.querySelectorAll('#licao .op');
  if (fb && !t.tato) { if (ops[i]) ops[i].classList.add(certo ? 'certa' : 'errada'); if (!certo && ops[t.c]) ops[t.c].classList.add('certa'); }
  else if (!t.tato && ops[i]) ops[i].classList.add('neutra');
  const [A, N, max] = lic.crit, atingiu = criterio(L.resps, A, N), acabou = atingiu || L.resps.length >= max;
  if (fb) {
    const frases = ['Muito bem!', 'Isso!', 'Arrasou!', 'Boa!', 'Perfeito!'];
    const b = $('#licao .l-base'); b.className = 'l-base ' + (certo ? 'ok' : 'no');
    b.innerHTML = `<div class="l-base-in"><div class="fb-txt">${certo ? '✔ ' + frases[Math.floor(Math.random() * frases.length)] : '✖ Olha a certa'}</div><button class="btn ${certo ? 'verde' : ''}" id="cont">Continuar</button></div>`;
    if (certo) { const a = APR(); BD.estrelas[a.id] = (BD.estrelas[a.id] || 0) + 1; }
    const seguir = () => { if (!L) return; acabou ? finalizar(false, atingiu) : avancar(); };
    $('#cont').onclick = seguir; L.auto = setTimeout(seguir, certo ? 1300 : 2400);
  } else setTimeout(() => { if (!L) return; acabou ? finalizar(false, atingiu) : avancar(); }, 450);
}
function avancar() { clearTimeout(L.auto); L.i++; L.bloq = false; desenharTentativa(); }
function finalizar(interrompida, atingiu = false) {
  clearTimeout(L.auto); L.fim = true;
  const lic = L.lic, a = APR(), ac = L.resps.filter(r => r).length;
  const sess = { id: uid(), apr:a.id, lic:lic.id, titulo:lic.titulo, unidade:lic.u.nome, tipo:lic.tipo, inicio:L.inicio, fim:Date.now(), resps:L.resps, acertos:ac, total:L.resps.length, pct: L.resps.length ? Math.round(100 * ac / L.resps.length) : 0, atingiu: !!atingiu, crit:critTxt(lic) };
  BD.sessoes.push(sess); BD.dias[a.id] = [...new Set([...(BD.dias[a.id] || []), hoje()])];
  const msg = interrompida ? 'Lição interrompida.' : registrarResultado(lic, sess);
  if (atingiu) BD.estrelas[a.id] = (BD.estrelas[a.id] || 0) + 5;
  gravar();
  if (interrompida) return;
  $('#licao').innerHTML = `<div class="l-meio"><div class="fim"><div class="grande">${atingiu ? '🏆' : '💪'}</div><h2>${atingiu ? 'Lição concluída!' : 'Fim da lição'}</h2><p class="ajuda" style="font-size:16px">${esc(msg)}</p>
    <div class="cards"><div>${ac}/${L.resps.length}<small>acertos</small></div><div>${critTxt(lic)}<small>critério</small></div><div>${atingiu ? '+5 ⭐' : '–'}<small>bônus</small></div></div>
    <div class="pontos">${L.resps.map(r => `<i class="${r ? '' : 'n'}"></i>`).join('')}</div><p style="margin-top:26px"><button class="btn verde" id="voltar">Continuar</button></p></div></div>`;
  $('#voltar').onclick = () => fecharLicao(false);
}
document.addEventListener('keydown', (e) => { if (!L) return; if (e.key === 'Enter' && $('#cont')) $('#cont').click(); const n = +e.key; if (n >= 1 && n <= 4) { const b = document.querySelectorAll('#licao .op')[n - 1]; if (b) b.click(); } });

mostrar('trilha');
</script>
